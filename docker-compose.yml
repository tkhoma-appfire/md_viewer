services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: md_viewer_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      MDS_DIR: /data/mds
    volumes:
      - ./mds:/data/mds
    expose:
      - "3000"
    networks:
      - md_viewer_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: md_viewer_client
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - md_viewer_net

  nginx:
    image: nginx:1.27-alpine
    container_name: md_viewer_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - md_viewer_net

networks:
  md_viewer_net:
    driver: bridge
