worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    upstream md_viewer_client {
        server client:80;
    }

    upstream md_viewer_server {
        server server:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # React/Vite static app under /md_viewer/
        location /md_viewer/ {
            proxy_pass http://md_viewer_client/md_viewer/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional: redirect bare path to trailing slash
        location = /md_viewer {
            return 301 /md_viewer/;
        }

        # API for the Node server
        location /md_viewer/api/ {
            rewrite ^/md_viewer/api/(.*)$ /api/$1 break;
            proxy_pass http://md_viewer_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 200 'md_viewer app: open http://localhost/md_viewer/\n';
            add_header Content-Type text/plain;
        }
    }
}
